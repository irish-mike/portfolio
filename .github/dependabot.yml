version: 2

updates:
  - package-ecosystem: npm
    directory: /portfolio_front_end
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    groups:
      compatible-updates:
        update-types:
          - minor
          - patch

  - package-ecosystem: composer
    directory: /portfolio_back_end/services
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    groups:
      compatible-updates:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris

  - package-ecosystem: docker-compose
    directory: /portfolio_back_end
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
